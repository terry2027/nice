<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body class="cognigy-webrtc-embed">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cognigy Webchat NA1  (Bottom-Right) -->
    <script src="https://github.com/Cognigy/Webchat/releases/latest/download/webchat.js"></script>
    <script>
      // initWebchat resolves with the webchat API; keep it on window so the React
      // app can call webchat.sendMessage() (see src/lib/callSession.ts).
      initWebchat(
        "https://cognigy-endpoint-na1.nicecxone.com/035e8eef65446d4e8d708577eb2134e842f469f9653152e3e1ee229decbb0025",
      ).then((webchat) => {
        window.__monashWebchat = webchat;
        console.log("[Monash Demo] webchat ready");
      });
    </script>

    <!-- Cognigy Webchat AU1 (Bottom-Right) -->
    <!-- script src="https://github.com/Cognigy/Webchat/releases/latest/download/webchat.js"></script -->
    <!-- script>
      initWebchat(
        "https://cognigy-endpoint-au1.nicecxone.com/6436589f4e66b0d74dc9af950af631fde87f2128774c9a0491c675492e134271",
      );
    </script -->

    <!-- Cognigy Click To Call (Center) -->
    <script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
    <script>
      addEventListener("load", (event) => {
        if (window.initWebRTCWidget) {
          // The widget resolves with an object that emits 'newRTCSession' for each call.
          // Keep a reference to the live call on window so the React app can use
          // session.sendInfo() (see src/lib/callSession.ts).
          Promise.resolve(
            window.initWebRTCWidget(
              "https://cognigy-endpoint-na1.nicecxone.com/c03b0f60b50548b0c7444c6ed24c311602a82c6ab6c6d2d60d19abdf0f8ac24e",
            ),
          ).then((widget) => {
            widget.on("newRTCSession", (session) => {
              window.__monashCallSession = session;
              console.log("[Monash Demo] call session captured", session);
              const clear = () => {
                console.log("[Monash Demo] call session cleared");
                if (window.__monashCallSession === session) {
                  window.__monashCallSession = undefined;
                }
              };
              session.on("ended", clear);
              session.on("failed", clear);
              session.on("terminated", clear);
            });
          });
        }
      });
    </script>
  </body>
</html>
