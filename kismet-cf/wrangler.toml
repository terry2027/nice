name = "kismet-cf"
main = "index.js"
compatibility_date = "2024-01-01"

# Public Pusher config — safe to commit, sent to the browser as-is.
[vars]
PUSHER_KEY = "e7d0fc6fa11f13494a25"
PUSHER_CLUSTER = "ap4"
PUSHER_CHANNEL = "kismet-pusher-channel"
PUSHER_EVENT = "state-changed"

[previews.vars]
PUSHER_KEY = "e7d0fc6fa11f13494a25"
PUSHER_CLUSTER = "ap4"
PUSHER_CHANNEL = "kismet-pusher-channel"
