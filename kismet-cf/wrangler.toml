name = "kismet-cf"
main = "index.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Public Pusher config — safe to commit, sent to the browser as-is.
[vars]
PUSHER_KEY = "e7d0fc6fa11f13494a25"
PUSHER_CLUSTER = "ap4"
PUSHER_CHANNEL = "kismet-pusher-channel"
PUSHER_EVENT = "state-changed"

[previews.vars]
PUSHER_KEY = "e7d0fc6fa11f13494a25"
PUSHER_CLUSTER = "ap4"
PUSHER_CHANNEL = "kismet-pusher-channel"
PUSHER_EVENT = "state-changed"

# Secrets (PUSHER_APP_ID, PUSHER_SECRET, WEBHOOK_SHARED_SECRET) are NOT set
# here — never commit them. Set each with:
#   wrangler secret put PUSHER_APP_ID
#   wrangler secret put PUSHER_SECRET
#   wrangler secret put WEBHOOK_SHARED_SECRET

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
# ...

