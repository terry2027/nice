<!-- Cognigy WebRTC Script -->
<script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>

<script>
  // 1. Initialize widget on page load so it is ready in the background
  window.addEventListener("load", () => {
    if (window.initWebRTCWidget) {
      window.initWebRTCWidget(
        "https://endpoint-trial.cognigy.ai/cc80b6b387a2aa47eb25413a1e4ba27650b6c6a865ebe79173142950f334814a"
      );
    }
  });

  // Helper function to find the real clickable button even inside Shadow DOM
  function findWidgetButton() {
    // 1. Standard DOM search across all common Cognigy wrapper elements
    const standardBtn = document.querySelector(
      '#cognigy-webrtc-widget button, .cognigy-webrtc-widget button, [class*="webrtc"] button'
    );
    if (standardBtn) return standardBtn;

    // 2. Shadow DOM search
    const hosts = document.querySelectorAll(
      '#cognigy-webrtc-widget, [class*="webrtc"], cognigy-webrtc'
    );
    for (const host of hosts) {
      if (host.shadowRoot) {
        const shadowBtn = host.shadowRoot.querySelector('button, [role="button"]');
        if (shadowBtn) return shadowBtn;
      }
    }

    return null;
  }

  function startWebRTCCall() {
    let attempts = 0;
    const maxAttempts = 20;

    const interval = setInterval(() => {
      attempts++;
      const callBtn = findWidgetButton();

      if (callBtn) {
        clearInterval(interval);
        // Dispatch synthetic click event
        callBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));

        // Hide your custom Kai card once call connects
        const card = document.getElementById("kai-agent-card");
        if (card) card.style.display = "none";
      } else if (attempts >= maxAttempts) {
        clearInterval(interval);
        console.warn("Could not find Cognigy WebRTC button to auto-click.");
      }
    }, 150);
  }
</script>
