<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kismet — Provider Portal</title>

    <style>
      /* Ensure the page body fills the viewport */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      /* Anchor Cognigy WebRTC Click-To-Call to Bottom-Left */
      #cognigy-webrtc-widget,
      .cognigy-webrtc-widget-container,
      div[class*="webrtc-widget"] {
        position: fixed !important;
        bottom: 24px !important;
        left: 24px !important;
        right: auto !important;
        z-index: 9999 !important;
      }
    </style>
  </head>
  <body>
    <!-- React Application Mount Point -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Cognigy Webchat (Bottom-Right) -->
    <script src="https://github.com/Cognigy/Webchat/releases/latest/download/webchat.js"></script>
    <script>
      initWebchat(
        "https://endpoint-trial.cognigy.ai/f16a92881c458c869a8c86609d830cbe8de06311779abf443bc3b3b3d4e02166"
      );
    </script>

    <!-- Cognigy WebRTC Click-to-Call Widget (Bottom-Left) -->
    <script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
    <script>
      window.addEventListener("load", () => {
        if (window.initWebRTCWidget) {
          window.initWebRTCWidget(
            "https://endpoint-trial.cognigy.ai/cc80b6b387a2aa47eb25413a1e4ba27650b6c6a865ebe79173142950f334814a"
          );
        }
      });
    </script>
  </body>
</html>
